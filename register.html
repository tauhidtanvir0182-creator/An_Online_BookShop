
<!DOCTYPE html>
<html lang="en">
<head>
    <title>BookNest - Registration</title>
    <link rel="stylesheet" href="register.css">
</head>
<body>

    <header class="site-header">
        <h1>BookNest</h1>
        <p>Create your customer account</p>

        <nav class="nav">
            <a href="index.html">Home</a>
            <a href="register.html" class="active">Register</a>
            <a href="login.html">Login</a>
            <a href="profile.html">My Profile</a>
        </nav>
    </header>

    <button id="themeBtn" class="theme-button">Dark Mode</button>

    <main>
        <div class="form-wrapper">

            <div class="form-heading">
                <h2>Join Our BookNest Community</h2>
                <p>Create your account and start your journey.</p>
            </div>

            <form id="registerForm" novalidate>

                <fieldset>
                    <legend>Create Your Account</legend>

                    <label for="name">Full Name:</label>
                    <input type="text" id="name" name="full_name"
                           placeholder="Enter your full name">
                    <p id="nameError" class="error"></p>

                    <label for="email">Email Address:</label>
                    <input type="text" id="email" name="email"
                           placeholder="example@gmail.com">
                    <p id="emailError" class="error"></p>

                    <label for="password">Password:</label>
                    <input type="password" id="password" name="password"
                           placeholder="Create a password">
                    <p id="passwordError" class="error"></p>

                    <label for="confirmPassword">Confirm Password:</label>
                    <input type="password" id="confirmPassword"
                           placeholder="Enter password again">
                    <p id="confirmError" class="error"></p>

                    <label for="phone">Phone Number:</label>
                    <input type="text" id="phone" name="phone"
                           placeholder="Enter phone number">
                    <p id="phoneError" class="error"></p>

                    <label for="address">Address:</label>
                    <textarea id="address" name="address"
                              rows="4"
                              placeholder="Enter your address"></textarea>
                    <p id="addressError" class="error"></p>

                    <div class="terms">
                        <input type="checkbox" id="terms">
                        <label for="terms">
                            I agree to the terms and conditions.
                        </label>
                    </div>

                    <p id="termsError" class="error"></p>
                    <p id="errorMessage"></p>

                    <button type="submit" id="registerBtn">
                        Create Account
                    </button>

                </fieldset>

            </form>

            <p class="bottom-text">
                Already have an account?
                <a href="login.html">Login here</a>
            </p>

        </div>
    </main>

    <footer>
        <p>BookNest - Your Trusted Online Bookstore</p>
    </footer>

    <script src="theme.js"></script>
    <script src="register.js"></script>

</body>
</html>
