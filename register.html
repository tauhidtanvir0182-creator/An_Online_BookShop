
<!DOCTYPE html>
<html lang="en">
<head>
    <title>BookNest - Registration</title>
    <link rel="stylesheet" href="style1.css">
</head>
<body>

    <h1 align="center"><i>BookNest</i></h1>

    <p align="center">Create your customer account</p>

    <hr>

    <p align="center">
        <a href="index.html">Home</a> |
        <a href="register.html">Register</a> |
        <a href="login.html">Login</a> |
        <a href="profile.html">My Profile</a>
    </p>

    <hr>

    <h2 class="class1">Customer Registration</h2>

    <form action="" method="get">

        <label for="name">Full Name:</label>
        <input type="text" id="name" name="full_name" required>
        <br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>
        <br><br>

        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required>
        <br><br>

        <label for="phone">Phone Number:</label>
        <input type="text" id="phone" name="phone" required>
        <br><br>

        <label for="address">Address:</label>
        <br><br>

        <textarea id="address" name="address" rows="4" cols="40" placeholder="Enter your address"></textarea>

        <br><br>

        <input type="checkbox" id="terms" name="terms" required>
        <label for="terms">I agree to the terms and conditions.</label>

        <br><br>

        <button type="submit">Register</button>

    </form>

    <p>Already have an account? <a href="login.html">Login here</a></p>

    <hr>

    <p align="center">BookNest - Your Trusted Online Bookstore</p>

</body>
</html>
