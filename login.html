
<!DOCTYPE html>
<html lang="en">
<head>
    <title>BookNest - Login</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>

    <header class="site-header">
        <h1>BookNest</h1>
        <p>Welcome back to your reading corner.</p>

        <nav class="nav">
            <a href="index.html">Home</a>
            <a href="register.html">Register</a>
            <a href="login.html" class="active">Login</a>
            <a href="profile.html">My Profile</a>
        </nav>
    </header>

    <button id="themeBtn" class="theme-button">Dark Mode</button>

    <main>
        <div class="login-container">

            <div class="login-icon">📚</div>

            <h2>Welcome Back!</h2>
            <p>Login to continue your BookNest journey.</p>

            <form id="loginForm" novalidate>

                <label for="email">Email Address:</label>
                <input type="text" id="email"
                       placeholder="Enter your email">
                <p id="emailError" class="error"></p>

                <label for="password">Password:</label>
                <input type="password" id="password"
                       placeholder="Enter your password">
                <p id="passwordError" class="error"></p>

                <p id="loginError" class="error"></p>

                <button type="submit" id="loginBtn">
                    Login
                </button>

            </form>

            <p class="bottom-text">
                New to BookNest?
                <a href="register.html">Create an account</a>
            </p>

        </div>
    </main>

    <footer>
        <p>BookNest - Your Trusted Online Bookstore</p>
    </footer>

    <script src="theme.js"></script>
    <script src="login.js"></script>

</body>
</html>
