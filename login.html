<!DOCTYPE html>
<html lang="en">
<head>
    <title>BookNest - Login</title>
    <link rel="stylesheet" href="style1.css">
<base target="self">
</head>
<body>

    <div class="site-header">
        <h1 align="center"><i>BookNest</i></h1>

        <p align="center">Welcome back to BookNest.</p>

        <nav class="nav">
            <a href="index.html">Home</a>
            <a href="register.html">Register</a>
            <a href="login.html">Login</a>
            <a href="profile.html">My Profile</a>
        </nav>

        <hr>
    </div>

    <h2 class="class1">Customer Login</h2>

    <div class="form-wrapper">
        <form id="loginForm" action="" method="post">

            <label for="email">Email Address:</label>
            <input type="email" id="email" name="email">
            <br>
            <label for="password">Password:</label>
            <input type="password" id="password" name="password">
            <br><br>

            <p id="loginError" style="color: #B22222;"></p>

            <button type="submit" id="loginBtn">Login</button>

        </form>
    </div>

    <p align="center">New to BookNest? <a href="register.html">Create an account</a></p>

    <hr>

    <p align="center">BookNest - Your Trusted Online Bookstore</p>

    <script>
        const loginForm = document.getElementById("loginForm");
        const emailInput = document.getElementById("email");
        const passwordInput = document.getElementById("password");
        const loginError = document.getElementById("loginError");

        loginForm.addEventListener("submit", function (event) {
            const email = emailInput.value.trim();
            const password = passwordInput.value.trim();

    
            const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

            if (email === "" || password === "" || !emailPattern.test(email)) {
                event.preventDefault();
                loginError.textContent = "Please enter your valid email and password.";
            } else {
                loginError.textContent = "";
            }
        });

        
        loginForm.addEventListener("input", function () {
            loginError.textContent = "";
        });
    </script>

</body>
</html>
